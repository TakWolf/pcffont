[project]
name = "pcffont"
version = "0.0.34"
description = "A library for handling Portable Compiled Format (PCF) Fonts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TakWolf" },
]
maintainers = [
    { name = "TakWolf" },
]
keywords = ["pcf", "font"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "bdffont>=0.0.41",
    "freetype-py>=2.5.1",
]

[project.urls]
Homepage = "https://github.com/TakWolf/pcffont-python"
Source = "https://github.com/TakWolf/pcffont-python"
Issues = "https://github.com/TakWolf/pcffont-python/issues"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
